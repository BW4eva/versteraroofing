name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [nexoflow-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site with NexoFlow posts
        env:
          NEXOFLOW_API_KEY: ${{ secrets.NEXOFLOW_API_KEY || vars.NEXOFLOW_API_KEY }}
          NEXOFLOW_API_URL: ${{ vars.NEXOFLOW_API_URL }}
        run: node scripts/build-nexoflow.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
